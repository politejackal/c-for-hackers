id: c-for-hackers
name: C for Hackers
description: |
  Learn C through a hacker's eyes. No programming experience needed, but you should be comfortable with the terminal: finish Linux Luminarium first.

  Challenges are of four types:

  - **Read:** say what the C code does.
  - **Write:** write a program that passes the checker.
  - **Fix:** repair a broken program.
  - **Break:** find the bug and make the program misbehave.

  The first three teach you the language. The fourth teaches you to think like a hacker, and that's where this dojo is heading!
award:
  emoji: 🧨

